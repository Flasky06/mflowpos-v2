name: Deploy Frontends to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'mflow-v2-frontend/**'
      - 'mflow-admin-web/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy-pos-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Main POS Web
        run: |
          cd mflow-v2-frontend
          npm ci
          npm run build

      - name: Deploy POS Web to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: mflow-pos
          directory: mflow-v2-frontend/dist

  deploy-admin-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build SuperAdmin Web
        run: |
          cd mflow-admin-web
          npm ci
          npm run build

      - name: Deploy SuperAdmin Web to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: mflow-admin
          directory: mflow-admin-web/dist

name: Deploy Backend to Hetzner VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mflow-v2-backend/**'
      - 'mflow-v2-frontend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER || 'root' }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          password: ${{ secrets.HETZNER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -e

            echo "==> Fetching latest code..."
            cd /var/www/mflow-v2
            git fetch origin main
            git reset --hard origin/main

            echo "==> Deploying Backend..."
            cd /var/www/mflow-v2/mflow-v2-backend
            npm ci
            npx prisma generate
            npx prisma db push --accept-data-loss
            node prisma/seed.js || true
            npm run build
            pm2 restart mflow-backend --update-env || pm2 start dist/server.js --name mflow-backend
            pm2 save

            echo "==> Deploying Frontend..."
            cd /var/www/mflow-v2/mflow-v2-frontend
            npm ci
            npm run build

            echo "==> Configuring Nginx SPA Routing & MIME types..."
            cat << 'EOF' > /etc/nginx/sites-available/mflowpos
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mflowpos.com www.mflowpos.com _;

    root /var/www/mflow-v2/mflow-v2-frontend/dist;
    index index.html;

    include /etc/nginx/mime.types;

    # Static frontend assets & SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy API backend requests
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
EOF
            ln -sf /etc/nginx/sites-available/mflowpos /etc/nginx/sites-enabled/default || true
            ln -sf /etc/nginx/sites-available/mflowpos /etc/nginx/sites-enabled/mflowpos || true
            nginx -t && systemctl reload nginx || true

            echo "==> Done! Both Frontend & Backend are fully live."
        env:
          # Sensitive — stored as GitHub Secrets
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENWA_API_KEY: ${{ secrets.OPENWA_API_KEY }}
          # Non-sensitive — stored as GitHub Variables
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          FROM_NAME: ${{ vars.FROM_NAME }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          OPENWA_BASE_URL: ${{ vars.OPENWA_BASE_URL }}
          OPENWA_SESSION_ID: ${{ vars.OPENWA_SESSION_ID }}


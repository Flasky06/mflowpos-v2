name: Deploy Backend to Hetzner VPS

on:
  push:
    branches:
      - main
    paths:
      - 'mflow-v2-backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mflow-v2-backend/package-lock.json

      - name: Type Check
        run: |
          cd mflow-v2-backend
          npm ci
          npx tsc --noEmit

      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          envs: DATABASE_URL,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,RESEND_API_KEY,FROM_EMAIL,FROM_NAME,FRONTEND_URL,OPENWA_BASE_URL,OPENWA_API_KEY,OPENWA_SESSION_ID,HETZNER_HOST,HETZNER_USER
          script: |
            set -e

            echo "==> Pulling latest code..."
            cd /var/www/mflow-v2
            git pull origin main

            echo "==> Writing .env from GitHub Secrets..."
            cat > /var/www/mflow-v2/mflow-v2-backend/.env <<EOF
            PORT=8080
            NODE_ENV=production

            DATABASE_URL=$DATABASE_URL

            JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET
            JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET
            JWT_ACCESS_EXPIRATION=15m
            JWT_REFRESH_EXPIRATION=7d

            RESEND_API_KEY=$RESEND_API_KEY
            FROM_EMAIL=$FROM_EMAIL
            FROM_NAME=$FROM_NAME

            FRONTEND_URL=$FRONTEND_URL

            OPENWA_BASE_URL=$OPENWA_BASE_URL
            OPENWA_API_KEY=$OPENWA_API_KEY
            OPENWA_SESSION_ID=$OPENWA_SESSION_ID
            EOF

            echo "==> Installing dependencies..."
            cd mflow-v2-backend
            npm ci --omit=dev

            echo "==> Generating Prisma client..."
            npx prisma generate

            echo "==> Applying DB schema..."
            npx prisma db push --accept-data-loss

            echo "==> Seeding database..."
            node prisma/seed.js || true

            echo "==> Building TypeScript..."
            npm run build

            echo "==> Restarting PM2 process..."
            pm2 restart mflow-backend --update-env || pm2 start dist/server.js --name mflow-backend
            pm2 save

            echo "==> Done! API is live."
        env:
          # Sensitive — stored as GitHub Secrets
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENWA_API_KEY: ${{ secrets.OPENWA_API_KEY }}
          # Non-sensitive — stored as GitHub Variables
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          FROM_NAME: ${{ vars.FROM_NAME }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          OPENWA_BASE_URL: ${{ vars.OPENWA_BASE_URL }}
          OPENWA_SESSION_ID: ${{ vars.OPENWA_SESSION_ID }}


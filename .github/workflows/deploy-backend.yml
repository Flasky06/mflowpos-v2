name: Deploy Backend to Hetzner VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mflow-v2-backend/**'
      - 'mflow-v2-frontend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER || 'root' }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          password: ${{ secrets.HETZNER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -e

            echo "==> Fetching latest code..."
            cd /var/www/mflow-v2
            git fetch origin main
            git reset --hard origin/main

            echo "==> Deploying Backend..."
            cd /var/www/mflow-v2/mflow-v2-backend
            npm ci
            npx prisma generate
            npx prisma db push --accept-data-loss
            node prisma/seed.js || true
            npm run build
            pm2 restart mflow-backend --update-env || pm2 start dist/server.js --name mflow-backend
            pm2 save

            echo "==> Deploying Frontend..."
            cd /var/www/mflow-v2/mflow-v2-frontend
            npm ci
            npm run build

            echo "==> Reloading Nginx..."
            nginx -t && systemctl reload nginx || true

            echo "==> Done! Both Frontend & Backend are fully live."
        env:
          # Sensitive — stored as GitHub Secrets
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENWA_API_KEY: ${{ secrets.OPENWA_API_KEY }}
          # Non-sensitive — stored as GitHub Variables
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          FROM_NAME: ${{ vars.FROM_NAME }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          OPENWA_BASE_URL: ${{ vars.OPENWA_BASE_URL }}
          OPENWA_SESSION_ID: ${{ vars.OPENWA_SESSION_ID }}

